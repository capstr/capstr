<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capstr | Select Network Adapter</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #bannerImage {
            width: 50%;
            height: auto;
            display: block; /* Remove any space below the image */
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 3em;
        }

        body {
            text-align: center;
            font-size: 0.7em;
        }

        .option {
            font-size: 1.5em;
        }


    </style>
</head>
</head>
<body>
    <div class="titlebar">
    </div>
    <img src="icons/capstrlogo.jpg" alt="Capstr Logo" id="bannerImage">
    <h1>Setup</h1> 
    <p class="option">Network Adapter <select id="adapterSelect" class="line-type-box"></select></p>
    <p class="option">Network Port <input type="text" class="user-input" id="networkPortInput" value=3001></p> 
    <p class="option">Serial Port (Experimental)<select id="serialPortSelect" class="line-type-box"></select></p>
    <button class="button" onclick="selectAdapter()">Proceed</button>
    <script src="selectAdapter.js"></script>

    <p><b>A free, open source captioning solution for live theatre</b></p>
    <p><b>Capstr is made possible thanks to support from: </b><br> University of Maryland<br>Oregon State University<br>Andy's Summer Playhouse</b></p>
    <p id="appVersion"></p>
    

</body>
</html>
